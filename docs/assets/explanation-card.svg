<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>What an explainable drug-disease card could show</title>
<desc>A four-step mechanism path from a drug to a disease, above three cards: what the models say, the evidence behind each hop, and the watch-outs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="340" fill="#FFFFFF"/>
<rect x="40" y="30" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="95" y="48" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Baricitinib</text>
<text x="95" y="68" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Drug</text>
<line x1="154" y1="62" x2="199" y2="62" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="176" y="50" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">inhibits</text>
<rect x="203" y="30" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="258" y="48" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">AAK1</text>
<text x="258" y="68" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Target</text>
<line x1="317" y1="62" x2="362" y2="62" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="339" y="50" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">drives</text>
<rect x="366" y="30" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="421" y="48" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Endocytosis</text>
<text x="421" y="68" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Process</text>
<line x1="480" y1="62" x2="525" y2="62" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="502" y="50" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">enables</text>
<rect x="529" y="30" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="584" y="48" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">COVID-19</text>
<text x="584" y="68" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Disease</text>
<rect x="40" y="130" width="180" height="150" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="52" y="150" font-size="14" font-weight="500" fill="#3C3489" text-anchor="start" dominant-baseline="central">Model says</text>
<text x="52" y="176" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">Treats</text>
<rect x="52" y="186" width="156" height="8" rx="2" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<rect x="52" y="186" width="104" height="8" rx="2" fill="#534AB7"/>
<text x="52" y="210" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">Does not treat</text>
<rect x="52" y="220" width="156" height="8" rx="2" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<rect x="52" y="220" width="18" height="8" rx="2" fill="#534AB7"/>
<text x="52" y="244" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">Unknown</text>
<rect x="52" y="254" width="156" height="8" rx="2" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<rect x="52" y="254" width="34" height="8" rx="2" fill="#534AB7"/>
<rect x="250" y="130" width="180" height="150" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="262" y="150" font-size="14" font-weight="500" fill="#3C3489" text-anchor="start" dominant-baseline="central">Evidence per hop</text>
<text x="262" y="180" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">Drug–target: DrugBank</text>
<text x="262" y="204" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">Gene–process: Reactome</text>
<text x="262" y="228" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">Process–disease: papers</text>
<text x="262" y="258" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">Source shown on every edge</text>
<rect x="460" y="130" width="180" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="472" y="150" font-size="14" font-weight="500" fill="#712B13" text-anchor="start" dominant-baseline="central">Watch-outs</text>
<text x="472" y="180" font-size="12" font-weight="400" fill="#993C1D" text-anchor="start" dominant-baseline="central">Contraindications</text>
<text x="472" y="204" font-size="12" font-weight="400" fill="#993C1D" text-anchor="start" dominant-baseline="central">Stopped trials</text>
<text x="472" y="228" font-size="12" font-weight="400" fill="#993C1D" text-anchor="start" dominant-baseline="central">Conflicting edges</text>
<text x="472" y="252" font-size="12" font-weight="400" fill="#993C1D" text-anchor="start" dominant-baseline="central">Popular-drug bias flag</text>
<text x="40" y="312" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Illustrative layout using a documented example path. Not output from any model.</text>
</svg>
